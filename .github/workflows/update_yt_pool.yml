name: Update YouTube Pool

on:
  schedule:
    # Запускается автоматически каждые 12 часов (в 00:00 и 12:00 UTC / 03:00 и 15:00 МСК)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Добавляет кнопку ручного запуска в интерфейсе GitHub

permissions:
  contents: write # Даем права боту пушить обновленный jazzhouse_ids.json обратно в репо

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp
        run: pip install -U yt-dlp

      - name: Run update script
        run: python update_yt_pool.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jazzhouse_ids.json
          git diff --staged --quiet || (git commit -m "chore: update jazzhouse video pool" && git push)
